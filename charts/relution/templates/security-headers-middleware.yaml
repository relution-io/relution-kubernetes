{{- if .Values.securityHeaders.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "relution.fullname" . }}-security-headers
  labels:
    {{- include "relution.labels" $ | nindent 4 }}
spec:
  headers:
    stsSeconds: {{ .Values.securityHeaders.stsSeconds }}
{{- end }}
